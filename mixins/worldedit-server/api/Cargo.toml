[package]
name = "mod-worldedit-server"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "WorldEdit for Horizon, server bundle: the selection other mods (WorldGuard) read and write"

[lib]
path = "src/lib.rs"

[dependencies]
# The launcher points this at the Horizon source it builds the game from. The editor itself is
# `horizon_client::worldedit_server::core` (the bundle's `lib` module re-exports the core crate).
horizon-client = { git = "https://github.com/horizon-rust/horizon", rev = "a589a3dd9be04fa7f17667c0175711aaa92e1147" }

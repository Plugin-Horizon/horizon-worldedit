[package]
name = "mod-worldedit"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "WorldEdit for Horizon, server bundle, as an arismoko trait mod (logic crate: horizon-worldedit-core)"

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
# Already in Horizon's Cargo.lock: the players' session files.
serde_json = "1"


[features]
default = []
# Code written against engine APIs that live in local branches (rec-regen: level.regenerate_chunks, rec-world-data: level.delete_chunks).
next-engine = []

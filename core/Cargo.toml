[package]
name = "horizon-worldedit-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "WorldEdit for a Horizon dedicated server: selections, patterns, masks, shapes, clipboard, history, brushes and schematic files (no Horizon types)"

# Every dependency must already be in Horizon's Cargo.lock (horizon-mixins checks it).
[dependencies]
flate2 = "1"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
# Already in Horizon's Cargo.lock: the players' session files.
serde_json = "1"
